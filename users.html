<!DOCTYPE html>
<html>
<head>
    <title>User Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #222;
            color: white;
        }

        a {
            text-decoration: none;
            padding: 6px 12px;
            margin: 3px;
        }

        .edit {
            color: blue;
        }

        .delete {
            color: red;
        }
    </style>
</head>

<body>

    <h1>👤 User Management</h1>

    <table>

        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Created At</th>
            <th>Actions</th>
        </tr>

        {% for user in users %}

        <tr>

            <td>{{ user.id }}</td>

            <td>{{ user.username }}</td>

            <td>{{ user.email }}</td>

            <td>{{ user.role }}</td>

            <td>{{ user.created_at }}</td>

            <td>

                <a class="edit"
                   href="/edit_user/{{ user.id }}">
                    Edit
                </a>

                <a class="delete"
                   href="/delete_user/{{ user.id }}"
                   onclick="return confirm('Delete this user?');">
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</body>
</html>
